<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-labelledby="tuck-title tuck-desc">
  <title id="tuck-title">Tuck</title>
  <desc id="tuck-desc">The Tuck mark. Two faint lines at the top stand for your audio. Under them, a soft layer rises from the bottom edge. Its top edge is folded back to show an apricot lining, and a running stitch crosses it: the left half in Heather for the left ear, the right half in Lichen for the right ear.</desc>
  <defs>
    <clipPath id="tuck-tile"><rect width="96" height="96" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#tuck-tile)">
    <!-- Ground: Loden. The icon leads with the dark ground in every theme (council must-change 10: no peach tile). -->
    <rect width="96" height="96" fill="#1C211C"/>
    <!-- Your audio, above: two Thread lines at 55%. They are dropped below 40 pt. -->
    <path d="M26 22 H70 M34 31 H62" stroke="#AEB2A0" stroke-width="4" stroke-linecap="round" opacity=".55"/>
    <!-- The layer: Fleece. It runs off the sides and bottom so it reads as a layer pulled up from below, not a free-floating pad or plaster. -->
    <path d="M0 48 Q48 40 96 48 V96 H0 Z" fill="#ECE7DA"/>
    <!-- The fold: the top edge turned back. The lining shows only in this strip, deepest in the middle. -->
    <path d="M0 48 Q48 40 96 48 V56 Q48 68 0 56 Z" fill="#EBB89A"/>
    <!-- The fold shadow: a hairline that keeps the turn readable at small sizes. -->
    <path d="M0 56 Q48 68 96 56" fill="none" stroke="#C99577" stroke-width="1.5"/>
    <!-- Running stitch. Left half Heather (deep), right half Lichen (deep). They meet at the centre with a gap, which is where the beat lives. -->
    <path d="M14 79 h8 M30 79 h8" stroke="#43618F" stroke-width="5" stroke-linecap="round"/>
    <path d="M58 79 h8 M74 79 h8" stroke="#7D7A2E" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Keyline: keeps the tile's edge visible on light grounds (Linen, Muslin). Invisible on dark ones. -->
  <rect x="0.5" y="0.5" width="95" height="95" rx="21.5" fill="none" stroke="#1C211C" stroke-opacity=".28"/>
</svg>
